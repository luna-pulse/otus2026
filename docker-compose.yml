services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    container_name: mini-survey-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      - backend
    container_name: mini-survey-frontend
